<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empresa</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
            width: 360px;
            padding: 32px;
            text-align: center;
            transition: box-shadow 0.6s ease, transform 0.6s ease;
        }
        .login-container:hover {
            box-shadow: 0 48px 90px rgba(0, 0, 0, 0.2);
            transform: translateY(-8px);
        }
        .login-container img {
            width: 306px;
            margin-bottom: 20px;
            filter: grayscale(100%);
            transition: filter 2.6s ease;
        }
        .login-container img:hover {
            filter: grayscale(0);
        }
        .login-container h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #1a1a1a;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border: 4px solid #e81313;
            background-color: #555;
            color: #fff;
            outline: none;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .actions a {
            color: #0073e6;
            text-decoration: none;
            font-size: 13px;
        }
        .actions a:hover {
            text-decoration: underline;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0073e6;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .login-button:hover {
            background: #01182e;
        }
    </style>
</head>
<body>
    <main class="login-container">
        <img src="imgs/login-612x612.jpg" alt="Logo de empresa">
        <h1>Iniciar sesión</h1>
        <form>
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>
            <div class="actions">
                <label class="remember">
                    <input type="checkbox" name="recordarme">
                    Recordarme
                </label>
                <a href="#">¿Olvidó su contraseña?</a>
            </div>
            <button type="submit" class="login-button">Iniciar</button>
        </form>
    </main>
</body>
</html>
