<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empresa</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
            width: 360px;
            padding: 32px;
            text-align: center;
            /* Agregamos la transición para el efecto hover, es provocado por el usuario al pasar el mouse por encima */
            transition: box-shadow 0.6s ease, transform 0.6s ease;
            /* Agregaremos una animacion al cargar el panel de login con desvanecimiento */
            animation: fadeInUp1 0.9s ease-out both;
        }

        @keyframes fadeInUp1 {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container:hover {
            box-shadow: 0 48px 90px rgba(0, 0, 0, 0.2);
            transform: translateY(-8px);
        }
        .login-container img {
            width: 306px;
            margin-bottom: 20px;
            filter: grayscale(50%);
            transition: filter 1s ease;
            animation: imageColorReveal 1.2s ease forwards;
        }
        .login-container img:hover {
            filter: grayscale(0);
        }
        @keyframes imageColorReveal {
            from {
                filter: grayscale(0%);
                opacity: 0;
            }
            to {
                filter: grayscale(100%);
                opacity: 1;
            }
        }
        .login-container h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #1a1a1a;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border: 4px solid #e81313;
            background-color: #555;
            color: #fff;
            outline: none;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .actions a {
            color: #0073e6;
            text-decoration: none;
            font-size: 13px;
        }
        .actions a:hover {
            text-decoration: underline;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        .login-button {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0073e6;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-top-color: #fff;
            border-radius: 50%;
            
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        .login-button.loading {
            background: #005bb5;
        }
        .login-button.loading .text {
            opacity: 1;
        }
        .login-button.loading .spinner {
            animation: spinLoading1 1s linear infinite;
        }
        @keyframes spinLoading1 {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
                opacity: 0;
            }
            25% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
            75% {
                opacity: 0.85;
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
                opacity: 1;
            }
        }
        .login-button:hover {
            background: #01182e;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginButton = document.querySelector('.login-button');
            loginButton.classList.remove('loading');
            loginButton.addEventListener('click', function(event) {
                event.preventDefault();
                loginButton.classList.add('loading');
                setTimeout(function() {
                    loginButton.classList.remove('loading');
                    alert('¡Inicio de sesión simulado!');
                }, 3000);
            });
        });
    </script>
</head>
<body>
    <main class="login-container">
        <img src="imgs/login-612x612.jpg" alt="Logo de empresa">
        <h1>Iniciar sesión</h1>
        <form>
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>
            <div class="actions">
                <label class="remember">
                    <input type="checkbox" name="recordarme">
                    Recordarme
                </label>
                <a href="#">¿Olvidó su contraseña?</a>
            </div>
            <button type="submit" class="login-button loading">
                <span class="text">Iniciar</span>
                <span class="spinner"></span>
            </button>
        </form>
    </main>
</body>
</html>
