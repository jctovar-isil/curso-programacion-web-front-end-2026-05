<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Mascota</title>
    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="scripts/script_api_mascota.js" defer></script>
</head>
<body>
    <h1>Registro de Mascota</h1>
    <div id="container-form" class="container-sm">
        <form id="mascotaForm">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="id" class="form-label">ID:</label>
                <input type="number" class="form-control" id="id" value="1" required>
                <div id="idHelp" class="form-text">ID de la Mascota.</div>
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" required>
                <div id="idNombre" class="form-text">Nombre de la Mascota.</div>
            </div>

            <label for="peso">Peso:</label>
            <input type="number" step="0.1" id="peso" value="28.7" required><br><br>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" value="3" required><br><br>
            <label for="dimension1">Dimensión 1:</label>
            <input type="number" id="dimension1" value="60" required><br>
            <label for="dimension2">Dimensión 2:</label>
            <input type="number" id="dimension2" value="200" required><br>
            <label for="dimension3">Dimensión 3:</label>
            <input type="number" id="dimension3" value="70" required><br><br>
            <label for="raza">Raza:</label>
            <input type="text" id="raza" value="Bulldog Frances" required><br><br>
            <label for="dueno">Dueño:</label>
            <input type="text" id="dueno" value="Juan Perez" required><br><br>
            <label for="foto">Foto:</label>
            <input type="text" id="foto" value="foto.jpg" required><br><br>
            <button type="submit">Registrar</button>
        </form>
    </div>
</body>
</html>
