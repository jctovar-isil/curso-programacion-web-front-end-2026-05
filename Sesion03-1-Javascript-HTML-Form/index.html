<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISIL - Sesion No. 3 - Javascript</title>
    <script src="scripts/script_poo.js" defer></script>
    <script src="scripts/catalogo.js" defer></script>
        <style>
            #gatos {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
                align-items: stretch;
                margin-top: 20px;
            }

            .gato-card {
                display: flex;
                flex-direction: column;
                width: 260px;
                border: 1px solid #ccc;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
                background: #fff;
            }

            .gato-card img {
                width: 100%;
                height: 180px;
                object-fit: cover;
            }

            .gato-contenido {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .gato-contenido h3 {
                margin: 0;
                font-size: 1.2rem;
                color: #333;
            }

            .gato-contenido p {
                margin: 0;
                color: #555;
                line-height: 1.4;
            }

            .gato-contenido p span {
                font-weight: 600;
                color: #222;
            }
        </style>
    </head>

    <body>
        <h1>ISIL - Sesion No. 3 - Javascript</h1>
        <h2>Catalogo de Mascotas</h2>

        <div id="catalogo">
            <div id="gatos">
                <article class="gato-card" id="gato-1">
                    <img src="https://placekitten.com/300/200" alt="Gato Simba">
                    <div class="gato-contenido">
                        <h3>Simba</h3>
                        <p><span>Raza:</span> Exótico de pelo corto</p>
                        <p><span>Color:</span> Gris atigrado</p>
                        <p><span>Edad:</span> 2 años</p>
                        <p><span>Nro de vacunas:</span> 3</p>
                    </div>
                </article>

                <article class="gato-card-2" id="gato-2">
                    <img src="https://placekitten.com/301/200" alt="Gato Luna">
                    <div class="gato-contenido">
                        <h3>Luna</h3>
                        <p><span>Raza:</span> Siamés</p>
                        <p><span>Color:</span> Blanco y crema</p>
                        <p><span>Edad:</span> 1 año</p>
                        <p><span>Nro de vacunas:</span> 2</p>
                    </div>
                </article>
            </div>
        </div>
</body>

</html>
