<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISIL - Ejemplo Simple con CSS Grid</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* CAMBIO CLAVE: GRID */
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .item {
      background: #f5f7fa;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    .item p {
      margin-top: .5rem;
      font-size: .9rem;
    }

    /* RESPONSIVE SIMPLE */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<h1>ISIL - Ejemplo Simple con CSS Grid</h1>

<div class="container">

  <div class="item">
    <img src="imgs/img01-paisaje001.jpg" alt="Paisaje 1">
    <p>Paisaje natural con excelente iluminación.</p>
  </div>

  <div class="item">
    <img src="imgs/img01-paisaje001.jpg" alt="Paisaje 2">
    <p>Vista panorámica adaptada a cualquier pantalla.</p>
  </div>

  <div class="item">
    <img src="imgs/img01-paisaje001.jpg" alt="Paisaje 3">
    <p>Imagen responsive usando CSS Grid.</p>
  </div>

</div>

</body>
</html>
